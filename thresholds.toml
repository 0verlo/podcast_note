# check_note.py 阈值。数字取自已有笔记的实测分布，由人工确认后修改。

[ledger]
q_cap = 1500              # 单 Q 覆盖 raw 有效字上限（ERROR）
density = [600, 900]      # 全文 raw 有效字 / Q 数 参考带（WARN）
keywords = [3, 8]         # 每条 Q 关键词数量（ERROR）
gap_budget = 30           # 未覆盖碎片不超过此字数时降为 WARN
keep_share_max = 40       # “保留”档覆盖的 raw 字数占比上限（WARN）

# 档位区间：答案有效字 / raw 有效字（%）。下限取自 S2EP13、S5EP08、VOL02、51 共 197 条 Q 的实测 P10；上限在 P90 之上放宽，字数不敏感，主要防转述。
[tiers]
"保留" = [70, 95]
"标准" = [55, 78]
"精简" = [40, 62]

[draft]
small_q = 200             # raw 有效字低于此值的 Q，档位越界降为 WARN（比例噪声大）
bias_warn = 6             # 全文实际比档位中值加权期望高/低超过此 pp 时 WARN

# 全文实际压缩带（WARN），按头部“形式：”选用。
[forms]
"讲座" = [55, 75]
"对谈" = [55, 75]
"漫谈" = [48, 70]
